<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeitkompass</title>
<meta name="theme-color" content="#16171a">
<meta name="description" content="Arbeitszeit, Zuschläge und JÜP nach MTV">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zeitkompass">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="14" fill="%2316171a"/%3E%3Ccircle cx="32" cy="32" r="20" fill="none" stroke="%23fff" stroke-width="6"/%3E%3Cpolygon points="32,15 37,32 27,32" fill="%23E85D04"/%3E%3Cpolygon points="32,49 37,32 27,32" fill="%238D9199"/%3E%3Ccircle cx="32" cy="32" r="2.6" fill="%23fff"/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=Archivo:wght@500..900&family=JetBrains+Mono:ital,wght@0,400..700;1,400..600&display=swap" rel="stylesheet">
<style>
:root,:root[data-theme]{
  color-scheme:dark;
  --page:radial-gradient(60vw 45vw at 10% 0%,rgba(255,255,255,.12),transparent 70%),radial-gradient(60vw 60vw at 100% 100%,rgba(140,160,190,.14),transparent 70%),linear-gradient(160deg,#4f535b,#3e4148);
  --ink:#f1f3f6;--ink2:#c3c8d0;--ink3:#9aa1ab;
  --glass:rgba(255,255,255,.10);--gline:rgba(255,255,255,.18);
  --panel:linear-gradient(180deg,rgba(84,89,98,.96),rgba(66,70,78,.96));
  --line2:rgba(255,255,255,.10);
  --shadow:inset 0 1px 0 rgba(255,255,255,.22),0 16px 36px -18px rgba(0,0,0,.55);
  --sheen:radial-gradient(120% 80% at 25% -10%,rgba(255,255,255,.38),rgba(255,255,255,0) 55%);
  --bevel:inset 0 1px 0 rgba(255,255,255,.55),inset 1px 0 0 rgba(255,255,255,.15),inset 0 -2px 3px rgba(0,0,0,.22),0 2px 4px rgba(0,0,0,.25);
  --g-n:radial-gradient(120% 80% at 25% -10%,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.08));
  --bv-n:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 3px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.2);
  --g-we:linear-gradient(180deg,#d2f4cc 0%,#bdecb6 60%,#addfa6 100%);
  --g-we2:linear-gradient(180deg,#cdf1c7 0%,#bdecb6 55%,#a8dca1 100%);
  --bv-we:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 2px rgba(0,0,0,.2);
  --g-auf:linear-gradient(180deg,#86c2f2 0%,#3f95dc 55%,#2c7bc0 100%);--g-lauf:linear-gradient(180deg,#5f86d6 0%,#2152b8 55%,#183f94 100%);--g-red:linear-gradient(180deg,#ec7a82 0%,#d23440 55%,#b02531 100%);--g-url:linear-gradient(180deg,#8ccd6f 0%,#57a639 55%,#46892d 100%);--g-fza:linear-gradient(180deg,#7fbc73 0%,#4c9141 55%,#3c7633 100%);--g-krank:linear-gradient(180deg,#a990e0 0%,#7350c9 55%,#5b3dab 100%);--g-dienst:linear-gradient(180deg,#9aa6bd 0%,#5f6f8c 55%,#4b5a75 100%);
  --a-auf:#3f95dc;--a-lauf:#2152b8;--a-red:#d23440;--a-url:#57a639;--a-fza:#4c9141;--a-krank:#7350c9;--a-dienst:#5f6f8c;
  --hol:#f2a3a9;--focus:#8fb6ff;--warn:#f0bf5a;--pos:#7fd8a0;--neg:#f2a3a9;
  --font-d:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font-u:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){:root:not([data-theme="x"]){color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:#3e4148}
body{margin:0;min-height:100%;background:var(--page);background-attachment:fixed;color:var(--ink);font:400 calc(14px*var(--fs,1))/1.45 var(--font-u);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.aurora{display:none}
.glass{background:var(--glass);border:1px solid var(--gline);-webkit-backdrop-filter:blur(22px) saturate(130%);backdrop-filter:blur(22px) saturate(130%);box-shadow:var(--shadow)}
.wrap{position:relative;z-index:1;max-width:1720px;margin:0 auto;padding:18px 22px 60px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{border:1px solid rgba(255,255,255,.22);background:var(--g-n);border-radius:10px;padding:7px 13px;font-weight:600;box-shadow:var(--bv-n)}
.btn:hover{filter:brightness(1.12)}
.btn:active{filter:brightness(.92)}
.btn.primary{background:var(--sheen),var(--g-lauf);border-color:rgba(255,255,255,.35);box-shadow:var(--bevel);text-shadow:0 1px 1px rgba(0,0,0,.3)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line2)}
.btn.danger{color:var(--neg)}
.icon{width:34px;height:34px;padding:0;display:inline-grid;place-items:center;font-size:calc(18px*var(--fs,1));line-height:1}

.top{display:flex;align-items:center;gap:20px;padding:12px 16px 12px 22px;border-radius:20px}
.brand{display:flex;align-items:baseline;gap:16px}
.brand h1{font:650 calc(25px*var(--fs,1))/1 var(--font-d);letter-spacing:-.02em;margin:0}
.yearnav{display:flex;align-items:center;gap:4px}
.yearnav span{font:600 calc(22px*var(--fs,1))/1 var(--font-d);min-width:58px;text-align:center;color:var(--ink2)}
.yearnav button{background:none;border:0;border-radius:8px;width:28px;height:28px;font-size:calc(20px*var(--fs,1));color:var(--ink3)}
.yearnav button:hover{background:var(--line2)}
.tabs{display:flex;gap:3px;padding:3px;border-radius:12px;background:rgba(0,0,0,.18);box-shadow:inset 0 1px 2px rgba(0,0,0,.3);margin-left:auto}
.tabs button{border:1px solid transparent;background:none;border-radius:9px;padding:6px 15px;font-weight:600;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--sheen),var(--g-lauf);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:var(--bevel);text-shadow:0 1px 1px rgba(0,0,0,.3)}
.tools{display:flex;align-items:center;gap:10px}
.sync{font-size:calc(12px*var(--fs,1));color:var(--ink3);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3)}
.sync.ok i{background:var(--a-url)}

.pegel{margin-top:12px;border-radius:20px;padding:16px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:18px 22px;align-items:start}
.gauge .gl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.gauge .gl b{font:600 calc(15px*var(--fs,1))/1.2 var(--font-d)}
.gauge .gl span{color:var(--ink2);font-size:calc(13px*var(--fs,1))}
.gauge .gl strong{font:650 calc(20px*var(--fs,1))/1 var(--font-d);color:var(--ink)}
.tube{position:relative;height:14px;border-radius:99px;background:rgba(0,0,0,.22);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.tube .fill{position:absolute;top:1px;bottom:1px;left:1px;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.fill.pool{background:linear-gradient(180deg,#7fa2e6,#2b5cc0 60%,#1f4aa0)}
.fill.konto{background:var(--g-url)}
.fill.mob{background:var(--g-mob)}.fill.mob.over{background:var(--g-red)}
.fill.jup{background:var(--g-url)}
.fill.plan{background:linear-gradient(180deg,#bfe3ad,#8ccd6f 60%,#57a639);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.pegel .facts{grid-column:1/-1}
.alerts{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.alert{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 10px 8px 14px;border-radius:12px;background:rgba(210,52,64,.24);border:1px solid rgba(255,130,140,.5);border-left:4px solid #e2505b;font-size:calc(13px*var(--fs,1))}
.alert.w{background:rgba(240,191,90,.14);border-color:rgba(240,191,90,.45);border-left-color:#f0bf5a}
.alert b{color:#fff}
.alert .btn{padding:5px 11px;font-size:calc(12.5px*var(--fs,1));white-space:nowrap}
.d.over{outline:2px solid #ff6b74;outline-offset:-1px}
@keyframes mobp{0%,100%{box-shadow:inset 0 0 0 200px rgba(229,48,60,0)}50%{box-shadow:inset 0 0 0 200px rgba(229,48,60,.62)}}
.d.mobover,.md.mobover{animation:mobp 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.d.mobover,.md.mobover{animation:none;box-shadow:inset 0 0 0 200px rgba(229,48,60,.4)}}
.d.limit{outline:2px dashed #f0bf5a;outline-offset:-1px}
.fill.neg{background:var(--g-red)}
.gauge .gs{display:flex;gap:16px;margin-top:7px;font-size:calc(12px*var(--fs,1));color:var(--ink2)}
.gauge .gs .w{color:var(--warn);font-weight:600}
.pegel .facts{display:flex;gap:24px;font-size:calc(13px*var(--fs,1));color:var(--ink2)}
.pegel .facts div{display:flex;flex-direction:column}
.pegel .facts b{font:600 calc(17px*var(--fs,1))/1.2 var(--font-d);color:var(--ink)}
.pegel .cap{grid-column:1/-1;font-size:calc(12px*var(--fs,1));color:var(--ink3);margin-top:-8px}

main{margin-top:14px}
.panel{border-radius:20px;padding:18px}

.yearscroll{overflow-x:auto}
.year{display:grid;grid-template-columns:repeat(12,minmax(104px,1fr));gap:7px;min-width:1260px;user-select:none}
.mcol h3{margin:0 0 7px;font:600 calc(15px*var(--fs,1))/1.2 var(--font-d);text-align:center;cursor:pointer;border-radius:8px;padding:5px 0}
.mcol h3:hover{background:var(--line2)}
.slot{height:27px;margin-bottom:4px}
.d,.md{background:var(--g-n);border:1px solid rgba(255,255,255,.22);box-shadow:var(--bv-n);color:var(--ink)}
.d{height:27px;margin-bottom:4px;display:flex;align-items:center;gap:5px;padding:0 7px 0 5px;border-radius:8px;font-size:calc(12px*var(--fs,1));position:relative;cursor:pointer}
.d:hover,.md:hover{filter:brightness(1.12)}
.d .n{width:17px;text-align:right;font-weight:700}
.d .w{width:18px;opacity:.8}
.d .chip{width:8px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.7)}
.d .lab{margin-left:auto;font-size:calc(10.5px*var(--fs,1));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 46px);min-width:0}
.d.we-sa,.md.we-sa{background:var(--g-we);border-color:rgba(255,255,255,.12);box-shadow:var(--bv-we);color:var(--ink2)}
.d.we-so,.md.we-so{background:var(--g-we2);border-color:rgba(255,255,255,.10);box-shadow:var(--bv-we);color:var(--ink2)}
.d.hol .n,.d.hol .w{color:var(--hol)}
[data-t="aufbau"].d,[data-t="abbau"].d,[data-t="aufbau"].md,[data-t="abbau"].md{background:var(--sheen),var(--g-auf)}
[data-t="laufzeit"].d,[data-t="laufzeit"].md{background:var(--sheen),var(--g-lauf)}
[data-t="urlaub"].d,[data-t="urlaub"].md{background:var(--sheen),var(--g-fza)}
[data-t="fza"].d,[data-t="fza"].md{background:var(--sheen),var(--g-url)}
[data-t="krank"].d,[data-t="krank"].md{background:var(--sheen),var(--g-krank)}
[data-t="dienst"].d,[data-t="dienst"].md{background:var(--sheen),var(--g-dienst)}
.d.zt,.md.zt{background:var(--sheen),var(--g-red)!important}
.d[data-t]:not([data-t="gleitzeit"]):not([data-t="frei"]),.md[data-t]:not([data-t="gleitzeit"]):not([data-t="frei"]),.d.zt,.md.zt{border-color:rgba(255,255,255,.35);box-shadow:var(--bevel);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.d.zt .n,.d.zt .w,.md.zt .top1 b{color:inherit!important}
.d.sel,.md.sel{outline:2px solid var(--focus);outline-offset:1px;z-index:2}
:is(.d,.md).is-today{outline:3px solid #ff6a00!important;outline-offset:1px;box-shadow:0 0 0 6px rgba(255,106,0,.28),0 0 14px rgba(255,106,0,.55)!important;z-index:3}
:is(.d,.md).is-today::before{content:"HEUTE";position:absolute;left:50%;top:-7px;transform:translateX(-50%);background:#ff6a00;color:#fff;font:700 calc(7.5px*var(--fs,1))/1 var(--font-u,system-ui);letter-spacing:.08em;padding:2px 5px;border-radius:4px;z-index:4;pointer-events:none}
.d .warn{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 1.5px rgba(0,0,0,.4)}
.d .warn.over{background:#ff6b74}
.sw.sw-n{background:linear-gradient(135deg,transparent 50%,#ffc61a 50%)!important;border:1px solid rgba(0,0,0,.15)}
.d.has-n::after,.md.has-n::after{content:"";position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;border-width:0 0 11px 11px;border-color:transparent transparent #ffc61a transparent;border-bottom-right-radius:inherit;filter:drop-shadow(0 0 1px rgba(0,0,0,.35))}
.md.has-n::after{border-width:0 0 12px 12px}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;font-size:calc(12px*var(--fs,1));color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:13px;height:13px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.3);background:var(--g-n);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.sw[data-t="aufbau"],.sw[data-t="abbau"]{background:var(--g-auf)}
.sw[data-t="laufzeit"]{background:var(--g-lauf)}
.sw[data-t="urlaub"]{background:var(--g-fza)}
.sw[data-t="fza"]{background:var(--g-url)}
.sw[data-t="krank"]{background:var(--g-krank)}
.sw[data-t="dienst"]{background:var(--g-dienst)}
.sw[data-t="frei"]{background:var(--g-we2)}
.sw.red{background:var(--g-red)}
.hint-line{font-size:calc(12px*var(--fs,1));color:var(--ink3);margin-top:8px}

.mview{display:grid;grid-template-columns:1fr 310px;gap:14px}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.mhead h2{margin:0;font:650 calc(26px*var(--fs,1))/1 var(--font-d);letter-spacing:-.02em;min-width:190px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;user-select:none}
.mgrid .wh{font-size:calc(12px*var(--fs,1));color:var(--ink3);font-weight:600;padding:0 6px 2px}
.md{min-height:108px;border-radius:13px;padding:8px 9px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative}
.md .top1{display:flex;align-items:baseline;gap:6px}
.md .top1 b{font:700 calc(19px*var(--fs,1))/1 var(--font-d)}
.md .top1 small{font-size:calc(11px*var(--fs,1));opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md .ty{font-size:calc(12px*var(--fs,1));font-weight:650}
.md .tm{font-size:calc(12px*var(--fs,1));opacity:.9}
.md .nt{margin-top:auto;display:flex;justify-content:space-between;font-size:calc(12px*var(--fs,1));font-weight:700}
.md .nt em{font-style:normal;opacity:.9;font-weight:650}
.md.empty{visibility:hidden}
.md.hol .top1 b{color:var(--hol)}
.md .phase{position:absolute;top:9px;right:9px;width:11px;height:11px;border-radius:3px;border:1.5px solid rgba(255,255,255,.85)}
.sum h3{margin:0 0 10px;font:600 calc(17px*var(--fs,1))/1.2 var(--font-d)}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:calc(13px*var(--fs,1))}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;text-align:right;font-weight:600}
.kv .sep{grid-column:1/-1;height:1px;background:var(--line2);margin:4px 0}
.kv .big{font:650 calc(16px*var(--fs,1))/1.3 var(--font-d)}
.pos{color:var(--pos)}.neg{color:var(--neg)}

.agrid{display:grid;grid-template-columns:1fr 360px;gap:14px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font:calc(12px*var(--fs,1)) var(--font-u)}
table{border-collapse:collapse;width:100%;font-size:calc(13px*var(--fs,1))}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line2)}
tbody tr{border-bottom:1px solid var(--line2)}
tbody tr:hover{background:var(--line2)}
tfoot td{font-weight:700;border-top:2px solid var(--line2)}
.tscroll{overflow-x:auto}
.notes{display:flex;flex-direction:column;gap:10px}
.note{padding:10px 12px;border-radius:12px;background:var(--g-n);border:1px solid rgba(255,255,255,.18);border-left:4px solid var(--a-auf);box-shadow:var(--bv-n);font-size:calc(13px*var(--fs,1))}
.note.w{border-left-color:var(--warn)}
.note.r{border-left-color:var(--a-red)}
.note.g{border-left-color:var(--a-fza)}
h2.sec{font:650 calc(20px*var(--fs,1))/1.2 var(--font-d);margin:0 0 12px}
.fairname{display:flex;align-items:center;gap:8px;font-weight:650}

.drawer{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;bottom:12px;width:410px;max-width:calc(100vw - 24px);border-radius:22px;padding:18px 18px 22px;overflow-y:auto;transform:translateX(calc(100% + 30px));transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--panel)}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.dh .dk{font:650 calc(21px*var(--fs,1))/1.15 var(--font-d);letter-spacing:-.01em}
.dh .hn{color:var(--hol);font-weight:600;font-size:calc(13px*var(--fs,1));margin-top:3px}
.dnav{display:flex;gap:4px}
.field{display:block;margin-bottom:14px}
.fl{display:block;font-size:calc(12px*var(--fs,1));color:var(--ink2);font-weight:600;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.seg button{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:var(--g-n);box-shadow:var(--bv-n);font-size:calc(12.5px*var(--fs,1));font-weight:600;text-align:left}
.seg button.on{border-color:var(--focus);box-shadow:0 0 0 1.5px var(--focus)}
input[type=time],input[type=number],input[type=text],input[type=month],select,textarea{width:100%;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.22);border-radius:9px;padding:7px 9px;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
select option{background:#4a4e56;color:#f1f3f6}
textarea{min-height:60px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 label{font-size:calc(12px*var(--fs,1));color:var(--ink2);font-weight:600;display:flex;flex-direction:column;gap:6px}
.subhint{font-size:calc(12px*var(--fs,1));color:var(--ink2);margin:6px 0 14px;display:flex;align-items:center;gap:8px}
.subhint button{background:none;border:0;color:var(--focus);font-weight:600;padding:0;font-size:calc(12px*var(--fs,1))}
.chk{display:flex;align-items:center;gap:8px;font-size:calc(13px*var(--fs,1));margin-bottom:14px}
.calc{border-radius:14px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);padding:12px 14px;margin:6px 0 14px}
.pauserow{display:grid;grid-template-columns:1fr 110px;gap:10px}

<script>
'use strict';
/* ===== Grundlagen ===== */
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MONS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const TYPES={
  aufbau:{label:'Aufbau',work:true},
  laufzeit:{label:'Laufzeit',work:true},
  abbau:{label:'Abbau',work:true},
  gleitzeit:{label:'Gleitzeit',work:true},
  arbeit:{label:'Gearbeitet',work:true},
  mobil:{label:'Mobiles Arbeiten',work:true},
  dienst:{label:'Sonstiger Dienst',work:true},
  urlaub:{label:'Urlaub',credit:true},
  fza:{label:'JÜP'},
  krank:{label:'Krank',credit:true},
  frei:{label:'Frei'}
};
const TORDER=['aufbau','laufzeit','abbau','gleitzeit','arbeit','mobil','dienst','urlaub','fza','krank','frei'];
const pad=n=>String(n).padStart(2,'0');
const K=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const P=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(k,n)=>{const d=P(k);d.setDate(d.getDate()+n);return K(d.getFullYear(),d.getMonth(),d.getDate())};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,d=2)=>(Math.round(x*100)/100).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const fh=x=>fmt(x)+' h';
const fhs=x=>(x>0.004?'+':x<-0.004?'−':'')+fmt(Math.abs(x))+' h';
const sum=a=>a.reduce((s,x)=>s+x,0);
const toMin=t=>{if(!t)return null;const a=t.split(':').map(Number);return a[0]*60+a[1]};

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return K(y,mo-1,da)}
const HC={};
function hol(y){
  if(HC[y])return HC[y];
  const E=easter(y),L={},S={};
  L[K(y,0,1)]='Neujahr';L[addDays(E,-2)]='Karfreitag';L[addDays(E,1)]='Ostermontag';L[K(y,4,1)]='Tag der Arbeit';
  L[addDays(E,39)]='Christi Himmelfahrt';L[addDays(E,50)]='Pfingstmontag';L[addDays(E,60)]='Fronleichnam';
  L[K(y,9,3)]='Tag der Deutschen Einheit';L[K(y,10,1)]='Allerheiligen';L[K(y,11,25)]='1. Weihnachtstag';L[K(y,11,26)]='2. Weihnachtstag';
  S[addDays(E,-48)]={n:'Rosenmontag',frei:true};
  S[addDays(E,-1)]={n:'Ostersamstag',after12:true};
  S[E]={n:'Ostersonntag',ft:true};
  S[addDays(E,48)]={n:'Pfingstsamstag',after12:true};
  S[addDays(E,49)]={n:'Pfingstsonntag',ft:true};
  S[K(y,11,24)]={n:'Heiligabend',ft:true,halb:true};
  S[K(y,11,31)]={n:'Silvester',ft:true,halb:true};
  return HC[y]={L,S};
}
function info(k){
  const y=+k.slice(0,4),h=hol(y),d=P(k).getDay(),L=h.L[k],S=h.S[k]||{};
  return{dow:d,legal:L||null,name:L||S.n||null,ft:!!L||!!S.ft,after12:!!S.after12,frei:!!S.frei,halb:!!S.halb,we:d===0||d===6};
}

/* ===== Zustand ===== */
const STORE='stundenkalender.v1';
function defaultSettings(){return{
  weekly:38,
  sollDays:[0,8.5,8.5,8.5,8.5,4,0],
  times:{gleit:['08:00','17:00'],gleitFr:['08:00','12:00'],std:['08:00','18:00'],lastAuf:['08:00','19:00'],firstMesse:['07:00','18:00']},
  pause:{mode:'auto',fixed:45},
  rates:{mehr:30,sa:30,so:60,ft:130,na:30},
  stack:'add',night:true,mobilMax:50,pool:150,expiryMonths:6,vacation:30,
  carry:{hours:0,until:'2027-06'},
  carryLots:[],carryAsOf:'',carryNote:'',
  startYear:2027,maxSeries:13,maxDaily:10,minRest:11,theme:'hell'
}}
function defaultFairs(){return[
  {id:'ism',k:'ISM',name:'ISM'},{id:'int',k:'INT',name:'Intermot'},{id:'ids',k:'IDS',name:'IDS'},
  {id:'hh',k:'H+H',name:'Handarbeit + Hobby'},{id:'fibo',k:'FIBO',name:'FIBO'},{id:'izu',k:'IZU',name:'Interzum'},
  {id:'spo',k:'Spoga',name:'Spoga Gafa'},{id:'gc',k:'GC',name:'Gamescom'},{id:'kj',k:'K+J',name:'Kind + Jugend'},{id:'anu',k:'ANU',name:'Anuga'}
]}
function freshState(){const y=new Date().getFullYear(),st=defaultSettings();st.startYear=y;return{v:2,updatedAt:0,settings:st,fairs:defaultFairs(),years:{[y]:{entries:{}},[y+1]:{entries:{}}}}}
function merge(def,src){if(!src||typeof src!=='object'||Array.isArray(src))return src===undefined?def:src;const o=Object.assign({},def);for(const k in src){o[k]=(def&&typeof def[k]==='object'&&!Array.isArray(def[k]))?merge(def[k],src[k]):src[k]}return o}
function normalize(s){
  const f=freshState();
  if(!s||typeof s!=='object')return f;
  const st=merge(f.settings,s.settings||{});if(!(s.v>=2))st.theme='hell';
  return{v:2,updatedAt:+s.updatedAt||0,settings:st,fairs:Array.isArray(s.fairs)?s.fairs:f.fairs,years:(s.years&&typeof s.years==='object')?s.years:f.years};
}
let ST=freshState();
const hasDOM=typeof document!=='undefined';
if(hasDOM){try{const raw=localStorage.getItem(STORE);if(raw)ST=normalize(JSON.parse(raw))}catch(e){}}

const sollOf=d=>{const a=ST.settings.sollDays;return Array.isArray(a)?(+a[d]||0):(d>=1&&d<=5?ST.settings.weekly/5:0)};
const weekSoll=()=>[1,2,3,4,5].reduce((s,d)=>s+sollOf(d),0);
/* Ein JÜP-Tag wie im Zeitnachweis: volles Tagessoll Mo–Do (8:30) */
const daily=()=>Math.max(...[1,2,3,4,5].map(sollOf))||weekSoll()/5;
function soll(k,i){i=i||info(k);if(i.we||i.legal||i.frei)return 0;const v=sollOf(i.dow);return i.halb?v/2:v}
function yearData(y){if(!ST.years[y])ST.years[y]={entries:{}};return ST.years[y]}
function stored(k){const y=ST.years[+k.slice(0,4)];return y&&y.entries[k]||null}
function defType(k){const i=info(k);return(soll(k,i)>0&&!i.halb)?'gleitzeit':'frei'}
function entry(k){const e=stored(k);if(!e)return{t:defType(k)};if((e.t==='fza'||e.t==='urlaub')&&soll(k)===0){const c=Object.assign({},e,{t:'frei'});delete c.t13;return c}return e}
const fairById=id=>ST.fairs.find(f=>f.id===id);

let MEMO={};
let FFC=null;
let BLK=null;
function invalidate(){MEMO={};FFC=null;BLK=null}
/* Freie Blöcke: zusammenhängende freie Tage (JÜP, Urlaub, 13.T, freie Wochenenden, Feiertage) mit mindestens einem JÜP- oder Urlaubstag */
function blockCount(k){
  const y=+k.slice(0,4);BLK=BLK||{};
  if(!BLK[y]){const M={};let run=[],taken=null;const flush=()=>{if(taken&&run.length>3)M[run[run.length-1]]=run.length;run=[];taken=null};
    let x=K(y-1,11,1);const end=K(y+1,0,31);
    const dOf=z=>{const yy=+z.slice(0,4);if(!ST.years[yy])return null;return computeYear(yy).days[z]};
    while(x<=end){const d=dOf(x);const tk=d&&(d.e.t==='fza'||d.e.t==='urlaub')&&d.soll>0;const free=d&&!d.work&&d.e.t!=='krank'&&(tk||d.soll===0);
      if(free){run.push(x);if(tk)taken=x}else flush();x=addDays(x,1)}
    flush();BLK[y]=M}
  return BLK[y][k]||0}
function firstOf(f,t,y){if(!FFC){FFC={};for(const yy in ST.years){const E=ST.years[yy].entries||{};for(const k in E){const e=E[k];if(!e.f)continue;const key=e.f+'|'+e.t+'|'+yy;if(!FFC[key]||k<FFC[key])FFC[key]=k}}}return FFC[f+'|'+t+'|'+y]}

function phases(y){
  const E=(ST.years[y]||{entries:{}}).entries,first=new Set(),lastAuf=new Set();
  for(const k in E){const e=E[k];if(!e.f)continue;
    if(e.t==='laufzeit'){let f=true;for(let j=1;j<=21;j++){const p=stored(addDays(k,-j));if(p&&p.f===e.f){if(p.t==='laufzeit')f=false;break}}if(f)first.add(k)}
    else if(e.t==='aufbau'){for(let j=1;j<=21;j++){const n=stored(addDays(k,j));if(n&&n.f===e.f){if(n.t==='laufzeit')lastAuf.add(k);break}}}}
  return{first,lastAuf};
}
function rule(k,e,pm){
  const T=ST.settings.times;
  if(e.t==='fza'&&e.half){const so=soll(k)/2,m=480+Math.round(so*60);return['halbJuep','halben JÜP-Tag',['08:00',pad(Math.floor(m/60))+':'+pad(m%60)]]}
  if(e.t==='gleitzeit'||e.t==='mobil'){const fr=P(k).getDay()===5&&T.gleitFr,mo=e.t==='mobil';return fr?['gleitFr',mo?'mobilen Freitag':'Gleitzeit-Freitag',T.gleitFr]:['gleit',mo?'mobilen Arbeitstag':'Gleitzeittag',T.gleit]}
  if(e.t==='aufbau'&&pm.lastAuf.has(k))return['lastAuf','letzten Aufbautag',T.lastAuf];
  if(e.t==='laufzeit'&&pm.first.has(k))return['firstMesse','ersten Messetag',T.firstMesse];
  return['std','Messe- und Diensttag',T.std];
}
function timesFor(k,e,pm){if(e.s&&e.e)return[e.s,e.e];return rule(k,e,pm)[2]}
function pauseFor(g){const p=ST.settings.pause;if(p.mode==='fixed')return g>0?Math.min(g,(+p.fixed||0)/60):0;return g<=6?0:g<=6.5?g-6:g<=9.5?.5:g<=9.75?g-9:.75}

function calcDay(k,pm){
  const i=info(k),so=soll(k,i),e=entry(k),T=TYPES[e.t]||TYPES.frei,S=ST.settings,R=S.rates;
  const half=e.t==='fza'&&!!e.half&&so>0;

function lab(dc){const e=dc.e;if(e.t==='gleitzeit')return dc.soll>0?'GLZ':'';if(e.t==='mobil'&&!e.f)return'Mobil';if(e.t==='fza')return e.t13?'13.T':e.half?'JÜP ½':'JÜP';if(e.t==='urlaub')return'Urlaub';if(e.f){const f=fairById(e.f);if(!f)return'?';const y=dc.k.slice(0,4);if(e.t==='aufbau'&&firstOf(e.f,'aufbau',y)===dc.k)return'Aufbau '+(f.name.length<=10?f.name:f.k);if(e.t==='laufzeit'&&firstOf(e.f,'laufzeit',y)===dc.k)return'Laufzeit';if(e.t==='abbau'&&firstOf(e.f,'abbau',y)===dc.k)return'Abbau';return f.k}return({dienst:'Dienst',aufbau:'Aufbau',laufzeit:'Laufzeit',abbau:'Abbau'})[e.t]||''}
function chipColor(t){const u=colOf(t);if(u)return u;return{arbeit:'var(--a-arb)',mobil:'var(--a-mob)',aufbau:'var(--a-auf)',abbau:'var(--a-auf)',laufzeit:'var(--a-lauf)',dienst:'var(--a-dienst)',gleitzeit:'rgba(255,255,255,.5)'}[t]||'transparent'}
function offLinked(dc){
  if(dc.work||dc.soll>0||dc.zt)return false;const off=x=>x&&(x.e.t==='fza'||x.e.t==='urlaub')&&x.soll>0;
  for(const dir of[-1,1]){let k=dc.k;for(let n=0;n<6;n++){k=addDays(k,dir);const x=dayOf(k);if(!x)break;if(x.soll>0||x.work){if(off(x))return true;break}}}
  return false}
function cellCls(dc){
  const i=dc.i,c=[];if(offLinked(dc))c.push('linked');
  if(dc.e.t==='frei'||dc.e.t==='gleitzeit'){if(i.dow===6)c.push('we-sa');if(i.dow===0)c.push('we-so')}
  if(i.ft||i.legal)c.push('hol');
  if(dc.zt)c.push('zt');
  if(UI.sel.has(dc.k))c.push('sel');
  if(dc.k===todayK)c.push('is-today');
  if(dc.e.n)c.push('has-n');
  if(dc.e.t==='mobil'){const C=computeYear(+dc.k.slice(0,4)),M=C&&C.months[+dc.k.slice(5,7)-1];if(M&&M.mobQ>(+ST.settings.mobilMax||50)+1e-6)c.push('mobover')}
  return c.join(' ');
}

const fhm=x=>{if(x==null||isNaN(x))return'';const neg=x<0;x=Math.abs(x);let h=Math.floor(x),mi=Math.round((x-h)*60);if(mi===60){h++;mi=0}return(neg?'−':'')+h+':'+pad(mi)};
function renderAbgleich(C){
  const Y=ST.years[UI.year]||{},O=Y.official||{};let rows='',any=false;
  for(let m=0;m<12;m++){const M=C.months[m],o=O[m]||null,off=o&&o.saldo!=null?o.saldo:null,diff=off!=null?M.creditCalc-off:null;if(o)any=true;
    let det='';
    if(o&&o.soll!=null){const comps=[['Soll',M.soll,o.soll],['Ist Mo–Sa',M.istMoSa,o.ist],['Mehrarbeit',M.mz,o.mz],['Samstag',M.z.sa,o.sa],['Sonntagsstunden',M.soH,o.soH],['Sonntag',M.z.so,o.so],['Feiertagsstunden',M.ftH,o.ftH],['Feiertag',M.z.ft,o.ft],['Nacht',M.z.na,o.na]].filter(c=>Math.abs((c[1]||0)-(c[2]||0))>=1.5/60);

function dayCheck(){

  Object.keys(E).sort().forEach(k=>{const e=E[k];if(e.oi==null)return;n++;const dc=C.days[k];if(!dc)return;const cal=dc.work?dc.net:dc.ist,d=cal-e.oi;if(Math.abs(d)>=2/60)L.push({k,cal,oi:e.oi,d,t:dc.e.t})});

function buildReport(y,m){

  const T=2/60,f=v=>v==null?'–':fhm(v),items=[],add=(lvl,title,detail,expl)=>items.push({lvl,title,detail,expl:expl||''});
  const mk=k=>+k.slice(5,7)-1===m&&k.startsWith(y+'-');
  let oiMS=0,nOi=0,fzaOi=0,fzaN=0,vacN=0,krN=0,moN=0;
  Object.keys(E).filter(mk).forEach(k=>{const e=E[k],dc=C.days[k];if(e.oi!=null){nOi++;if(P(k).getDay()!==0)oiMS+=e.oi}
    if(dc&&dc.soll>0){if(e.t==='fza'){fzaN++;fzaOi+=e.oi||0}if(e.t==='urlaub')vacN++;if(e.t==='krank')krN++;if(e.t==='mobil')moN++}});

    add('hinweis','Sollzeit',`Zeitnachweis ${f(O.soll)} h, Kalender ${f(M.soll)} h (Differenz ${d>0?'+':''}${fhm(d)}).`,'Meist eine andere Regel für Feiertage, 24.12./31.12. oder Teilzeit. Nur nachfragen, wenn der Nachweis offensichtlich zu viel Soll ansetzt.')}
  /* 2 Ist */

    if(Math.abs(d)<T)add('ok','Istzeit',`${f(O.ist)} h, entspricht der Summe der einzelnen Tage (Mo–Sa).`);
    else{const ex=[];if(ftH>0)ex.push(`${f(ftH)} h Feiertagsarbeit werden getrennt als Feiertagsstunden geführt`);if(fzaN&&((O.saldo0||0)<0||d>T))ex.push(`Freizeittage zählen nur als Ist, soweit Freizeitanspruch vorhanden war (${fzaN} Freizeittage im Monat)`);
      const rest=d-ftH;add(Math.abs(rest)<T||ex.length>1||(fzaN&&rest>0)?'hinweis':'pruefen','Istzeit',`Summe der Tage Mo–Sa ${f(oiMS)} h, Zeitnachweis ${f(O.ist)} h (Differenz ${d>0?'+':''}${fhm(d)}).`,ex.length?'Mögliche Erklärung: '+ex.join('; ')+'.':'Keine naheliegende Erklärung. Beim Personalbetreuer nachfragen.')}}
  /* 3 Saldo ohne Zuschläge */
  if(O.ist!=null&&O.soll!=null){const s0=O.saldo0!=null?O.saldo0:0,d=(O.ist-O.soll)-s0;Math.abs(d)<T?add('ok','Saldo ohne Zuschläge',`${s0<0?'':'+'}${f(s0)} h = Ist minus Soll, richtig gerechnet.`):
    add('pruefen','Saldo ohne Zuschläge',`Ausgewiesen ${f(s0)} h, Ist minus Soll ergibt ${f(O.ist-O.soll)} h.`,'Rechenfehler im Nachweis oder eine Korrektur, die nicht in den Tageszeilen steht. Nachfragen.')}
  /* 4 Zuschläge aus den Zeiten nachgerechnet */
  [['Samstagszuschlag 30 %',M.z.sa,O.sa],['Sonntagsstunden',M.soH,O.soH],['Sonntagszuschlag 60 %',M.z.so,O.so],['Feiertagsstunden',M.ftH,O.ftH],['Feiertagszuschlag 130 %',M.z.ft,O.ft],['Nachtzuschlag 30 %',M.z.na,O.na]].forEach(([n,c,o])=>{

   else{const pm=(Y.official||{})[m-1],prevNeg=pm&&(pm.saldo0||0)<0;

  /* 7 Tagesabgleich */
  const dl=Object.keys(E).filter(mk).sort().map(k=>{const e=E[k],dc=C.days[k];if(e.oi==null||!dc)return null;const cal=dc.work?dc.net:dc.ist,d=cal-e.oi;return Math.abs(d)>=T?{k,cal,oi:e.oi,d,t:dc.e.t}:null}).filter(Boolean);
  if(nOi)dl.length?add('hinweis','Tageswerte',`${dl.length} von ${nOi} Tagen ${dl.length===1?'weicht':'weichen'} von der eigenen Nachrechnung ab: `+dl.map(x=>`${fd(x.k)} ${TYPES[x.t].label} ${fhm(x.oi)} statt ${fhm(x.cal)}`).join('; ')+'.','Pause oder Anrechnung prüfen. Bei Krank-, Urlaubs- oder JÜP-Tagen rechnet der Nachweis teils mit dem geplanten Dienst.'):add('ok','Tageswerte',`Alle ${nOi} Tage passen zu Beginn, Ende und gesetzlicher Pause.`);
  /* 8 Arbeitszeitgesetz */
  const ld=C.longD.filter(mk),rd=C.restD.filter(x=>mk(x.k));
  if(ld.length||rd.length)add('info','Arbeitszeitgesetz',[ld.length?`${ld.length} ${ld.length===1?'Tag':'Tage'} über 10 h netto (${ld.map(k=>fd(k)).join(', ')})`:'',rd.length?`Ruhezeit unter 11 h vor ${rd.map(x=>fd(x.k)+' ('+fhm(x.gap)+' h)').join(', ')}`:''].filter(Boolean).join('; ')+'.','Kein Fehler im Nachweis, nur zur Info.');
  /* 9 Abwesenheiten */
  const ab=[fzaN?`${fzaN} JÜP/Freizeit`:'',vacN?`${vacN} Urlaub`:'',krN?`${krN} Krank`:'',moN?`${moN} mobil`:'',O.ho?`Homeoffice ${f(O.ho)} h (${fmt(O.ho/((O.ho||0)+(O.buero||0))*100,1)} %)`:''].filter(Boolean);
  if(ab.length)add('info','Abwesenheiten',ab.join(', ')+'.');
  if(O.urlK)add('info','Urlaubskontingent',`${fmt(O.urlK.tage,1)} Tage, verplant ${fmt(O.urlK.verbr,1)}, Rest ${fmt(O.urlK.rest,1)}.`);
  const nP=items.filter(i=>i.lvl==='pruefen').length,nH=items.filter(i=>i.lvl==='hinweis').length;
  return{y,m,items,nP,nH,fazit:nP?`${nP} ${nP===1?'Punkt':'Punkte'} zur Rückfrage beim Personalbetreuer${nH?', dazu '+nH+' Hinweis'+(nH>1?'e':''):''}.`:nH?`Keine Fehler gefunden. ${nH} Hinweis${nH>1?'e':''} zum Verständnis.`:'Keine Auffälligkeiten. Der Nachweis kann freigegeben werden.'};
}

/* Verfall-Planer */
function planExpiry(y){
  const Yd=yearData(y),orig=JSON.stringify(Yd.entries),S=ST.settings,TD=new Date(),TK=K(TD.getFullYear(),TD.getMonth(),TD.getDate());
  invalidate();const before=computeYear(y).expTot;const props=[],skip=new Set();let guard=0;
  try{
    while(guard++<150){
      invalidate();const C=computeYear(y);
      const mi=C.months.findIndex((m,i)=>m.expired>0.01&&!skip.has(i));if(mi<0)break;
      const A=y*12+mi,expM=A-1,srcM=expM-(+S.expiryMonths);
      if(Math.floor(expM/12)<y){skip.add(mi);continue}
      const f0=Math.max(srcM+1,y*12),from=K(Math.floor(f0/12),f0%12,1),to=K(Math.floor(expM/12),expM%12,dim(Math.floor(expM/12),expM%12));
      const over=new Set();C.series.filter(x=>x.n>S.maxSeries).forEach(x=>{let k=x.a;while(k<=x.b){over.add(k);k=addDays(k,1)}});
      const cands=[];let k=from>TK?from:TK;
      while(k<=to){const dc=C.days[k];if(dc&&dc.e.t==='gleitzeit'&&dc.soll>0&&!dc.e.ist){const d=dc.i.dow;cands.push({k,sc:(over.has(k)?100:0)+(dc.soll>=8?10:0)+(d===1||d===4?2:0),h:dc.soll})}k=addDays(k,1)}
      if(!cands.length){skip.add(mi);continue}
      cands.sort((a,b)=>b.sc-a.sc||(a.k<b.k?-1:1));const c=cands[0];
      Yd.entries[c.k]={t:'fza'};props.push({k:c.k,h:c.h,exp:expM,fix:over.has(c.k)});
    }
    invalidate();const after=computeYear(y).expTot;
    return{y,props:props.sort((a,b)=>a.k<b.k?-1:1),before,after};
  }finally{Yd.entries=JSON.parse(orig);invalidate()}
}

function dm(v,y){v=String(v||'').trim();if(!v)return'';let m=v.match(/^(\d{1,2})[.\/-](\d{1,2})\.?(?:(\d{2}|\d{4}))?$/);if(!m&&/^\d{3,8}$/.test(v)){const L=v.length;m=L===3?[v,v.slice(0,1),v.slice(1)]:L===4?[v,v.slice(0,2),v.slice(2)]:L===6||L===8?[v,v.slice(0,2),v.slice(2,4),v.slice(4)]:null}if(!m)return null;let yy=m[3]?+m[3]:y;if(yy<100)yy+=2000;const d=+m[1],mo=+m[2];if(mo<1||mo>12||d<1||d>dim(yy,mo-1))return null;return K(yy,mo-1,d)}

async function download(name,data,type){
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data:new Blob([data],{type})});return}}}catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function csv(){
  const C=computeYear(UI.year),rows=[['Datum','Wochentag','Tagesart','Messe','Beginn','Ende','Pause (h)','Netto (h)','Soll (h)','Zuschläge (h)','Feiertag','Notiz']];
  for(const k of Object.keys(C.days)){const dc=C.days[k],f=dc.e.f&&fairById(dc.e.f);rows.push([k,WD[dc.i.dow],TYPES[dc.e.t].label+(dc.e.t13?' (13.T)':''),f?f.name:'',dc.work?dc.times[0]:'',dc.work?dc.times[1]:'',fmt(dc.pause),fmt(dc.net),fmt(dc.soll),fmt(dc.zSum),dc.i.name||'',dc.e.n||''])}

function colOf(k){const c=(ST.settings.colors||{})[k];return c||null}
function txtOn(h){const n=parseInt(h.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255,l=(.2126*r+.7152*g+.0722*b)/255;return l>.62?'#1c2433':'#fff'}
function applyColors(){
  let el=document.getElementById('usercol');if(!el){el=document.createElement('style');el.id='usercol';document.head.appendChild(el)}
  const C=ST.settings.colors||{},css=[];
  const rule=(sel,h)=>{const t=txtOn(h);css.push(`html:root body ${sel}{background:var(--sheen),${h}!important;color:${t}!important;${t==='#fff'?'':'text-shadow:none!important;'}}`,`html:root body ${sel} :is(.n,.w,.l,.top1 b,.top1 small){color:${t}!important}`)};
  for(const k in C){const h=C[k];if(!/^#[0-9a-f]{6}$/i.test(h))continue;
    if(k==='zt')rule(':is(.d,.md).zt',h);
    else if(k==='we')rule(':is(.d,.md):is(.we-sa,.we-so):not(.zt)',h);

    css.push(`html body .wk-d[data-c="${k}"]{--c:${h}!important}`)}
  el.textContent=css.join('\n');

function shrinkImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('Datei nicht lesbar'));fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('Kein gültiges Bild'));im.onload=()=>{let w=im.width,h=im.height;const mx=1800;if(w>mx||h>mx){const f=mx/Math.max(w,h);w=Math.round(w*f);h=Math.round(h*f)}
  const c=document.createElement('canvas');let q=.78,url='';for(let i=0;i<8;i++){c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);url=c.toDataURL('image/jpeg',q);if(url.length<235000)break;if(q>.5)q-=.08;else{w=Math.round(w*.82);h=Math.round(h*.82)}}res(url)};im.src=fr.result};fr.readAsDataURL(file)})}

  if(bgRef){try{if(url)await bgRef.set({img:url,at:Date.now()});else await bgRef.delete()}catch(e){}}

$('#bgFile').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;const m=$('#bgMsg');if(m)m.textContent='Bild wird vorbereitet …';try{await setBgImage(await shrinkImage(f))}catch(e){const m2=$('#bgMsg');if(m2)m2.textContent=e.message||'Fehler beim Laden'}});

/* Datumsauswahl */
let DP=null;
function dpClose(){const el=document.getElementById('dp');if(el)el.remove();DP=null}
function dpOpen(btn){
  UI.mf=UI.mf||{};
  const id=btn.dataset.for,inp=document.querySelector(`input[data-mf="${id}"]`);if(!inp)return;
  if(DP&&DP.id===id){dpClose();return}dpClose();
  const y=UI.year,cur=dm(inp.value,y)||(id==='zr'&&UI.drawer?UI.drawer:null)||dm(UI.mf.l1,y)||dm(UI.mf.a,y)||(new Date().getFullYear()===y?todayK:K(y,0,1));
  DP={id,inp,y:+cur.slice(0,4),m:+cur.slice(5,7)-1,sel:dm(inp.value,y)};dpRender(btn)}
function dpRender(anchor){
  let el=document.getElementById('dp');if(!el){el=document.createElement('div');el.id='dp';el.className='dp';document.body.appendChild(el)}
  const {y,m}=DP,first=(new Date(y,m,1).getDay()+6)%7,F=UI.mf,rng={a:dm(F.a,UI.year),l1:dm(F.l1,UI.year),l2:dm(F.l2,UI.year),b:dm(F.b,UI.year)};
  let h=`<div class="dph"><button type="button" data-act="dp-prev" aria-label="Vorheriger Monat">‹</button><b>${MON[m]} ${y}</b><button type="button" data-act="dp-next" aria-label="Nächster Monat">›</button></div><div class="dpg">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<i>${w}</i>`).join('')}`;
  for(let i=0;i<first;i++)h+='<span></span>';
  for(let d=1;d<=dim(y,m);d++){const k=K(y,m,d),i=info(k),cls=[];if(i.we)cls.push('we');if(i.legal||i.ft)cls.push('hol');if(k===DP.sel)cls.push('sel');if(k===todayK)cls.push('tdy');
    if(DP.id==='zr'){if(UI.drawer&&k===UI.drawer)cls.push('sel');else if(UI.drawer&&DP.sel&&k>UI.drawer&&k<=DP.sel)cls.push('rl')}
    else if(rng.l1&&rng.l2&&k>=rng.l1&&k<=rng.l2)cls.push('rl');else if(rng.a&&rng.l1&&k>=rng.a&&k<rng.l1)cls.push('ra');else if(rng.b&&rng.l2&&k>rng.l2&&k<=rng.b)cls.push('ra');
    const st=stored(k);const busy=st&&st.f?' title="'+esc((fairById(st.f)||{}).name||'')+'"':(i.name?' title="'+esc(i.name)+'"':'');
    h+=`<button type="button" class="${cls.join(' ')}" data-act="dp-pick" data-k="${k}"${busy}>${d}${st&&st.f?'<em></em>':''}</button>`}
  h+='</div><div class="dpf"><span><em></em> schon belegt</span><button type="button" data-act="dp-close">Schließen</button></div>';
  el.innerHTML=h;
  const r=(anchor||DP.inp).getBoundingClientRect(),W=268;let x=r.left+window.scrollX,yy=r.bottom+window.scrollY+6;if(x+W>window.scrollX+innerWidth-8)x=window.scrollX+innerWidth-W-8;el.style.left=x+'px';el.style.top=yy+'px';
}
function dpPick(k){const inp=DP.inp,sameY=+k.slice(0,4)===UI.year;inp.value=k.slice(8)+'.'+k.slice(5,7)+'.'+(sameY?'':k.slice(0,4));inp.classList.remove('bad');UI.mf[DP.id]=inp.value;dpClose();
  const order=['a','l1','l2','b'],nx=order[order.indexOf(DP?DP.id:'')+1];inp.focus()}
document.addEventListener('mousedown',ev=>{if(DP&&!ev.target.closest('#dp')&&!ev.target.closest('.dpb'))dpClose()});
window.addEventListener('resize',()=>{if(DP)dpClose()});
/* Zeitnachweis-Import */
let pdfjsP=null;
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);if(pdfjsP)return pdfjsP;pdfjsP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=()=>{const L=window.pdfjsLib||window['pdfjs-dist/build/pdf'];if(!L){rej(new Error('PDF-Bibliothek fehlt'));return}L.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(L)};sc.onerror=()=>{pdfjsP=null;rej(new Error('PDF-Bibliothek konnte nicht geladen werden'))};document.head.appendChild(sc)});return pdfjsP}
async function pdfItems(file){const L=await loadPdfJs();const doc=await L.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const out=[];for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p);const tc=await pg.getTextContent();tc.items.forEach(it=>{if(it.str!=null)out.push({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0,p})})}return out}
function applyZN(z){
  const Y=yearData(z.y);Y.official=Y.official||{};Y.official[z.m]=Object.assign({},z.sum,{src:'pdf',at:Date.now()});
  for(const d in z.days){const x=z.days[d],k=K(z.y,z.m,+d);if(+k.slice(5,7)-1!==z.m)continue;const prev=stored(k)||{t:defType(k)},txt=x.text.join(' ');let e;
    if(/Krank|Kur\b|Reha/i.test(txt))e={t:'krank'};
    else if(/Urlaub/i.test(txt))e={t:'urlaub'};
    else if(/Freizeit|J\u00dcP|Gleittag|Zeitausgleich|Mehrarbeitsausgleich/i.test(txt)&&!x.segs.length)e={t:'fza'};
    else if(x.segs.length){const b=x.segs[0][0],en=x.segs[x.segs.length-1][1];let g=toMin(en)-toMin(b);if(g<=0)g+=1440;const ist=x.ist!=null?x.ist:(g/60-x.pause);const t=prev.f&&TYPES[prev.t]&&TYPES[prev.t].work?prev.t:(x.ho&&x.ho>=ist/2?'mobil':'arbeit');e={t,s:b,e:en,p:Math.max(0,Math.round(g-ist*60))};if(prev.f&&t!=='arbeit'&&t!=='mobil')e.f=prev.f}
    else e={t:'frei'};
    if(prev.n)e.n=prev.n;e.ist=1;{const oi=x.segs.length?x.ist:x.absIst;if(oi!=null)e.oi=oi}Y.entries[k]=e;}
  invalidate();
}
async function importZN(files){
  const msgs=[];let lastZ=null;const parsed=[];
  for(const f of files){try{parsed.push({f,z:parseZN(await pdfItems(f))})}catch(e){msgs.push(`<b>${esc(f.name)}:</b> ${esc(e.message||'Konnte nicht gelesen werden')}.`)}}
  parsed.sort((a,b)=>(a.z.y*12+a.z.m)-(b.z.y*12+b.z.m));
  for(const {f,z} of parsed){try{applyZN(z);lastZ=z;const C=computeYear(z.y),M=C.months[z.m],off=z.sum.saldo,diff=off!=null?M.creditCalc-off:null;
      msgs.push(`<b>${MON[z.m]} ${z.y} importiert.</b> <button class="btn sm" data-act="rpt-open" data-y="${z.y}" data-m="${z.m}">Prüfbericht</button> Kalender ${fhm(M.creditCalc)}, Zeitnachweis ${fhm(off)}: ${diff==null?'kein Saldo gefunden':Math.abs(diff)<3/60?'stimmt':'Abweichung '+(diff>0?'+':'')+fhm(diff)+', es gilt der Zeitnachweis'}.`)}
    catch(e){msgs.push(`<b>${esc(f.name)}:</b> ${esc(e.message||'Konnte nicht gelesen werden')}.`)}}
  save();
  if(lastZ){UI.year=lastZ.y;UI.view='auswertung';
    const S=ST.settings,lots=Object.entries(lastZ.fz||{}).map(([m,h])=>({m,h})),zA=lastZ.y*12+lastZ.m,cA=/^\d{4}-\d{2}$/.test(S.carryAsOf||'')?absM(S.carryAsOf,0):-1;
    if(zA<cA)msgs.push(`Übertrag bleibt beim neueren ${esc(S.carryNote||'Stand '+S.carryAsOf)}.`);
    else if(lastZ.y===S.startYear-1&&Object.keys(lastZ.fz||{}).length&&confirm(`Freizeitanspruch aus ${MON[lastZ.m]} ${lastZ.y} als Übertrag ins Jahr ${S.startYear} übernehmen?`)){S.carryLots=lots;S.carryAsOf=lastZ.y+'-'+pad(lastZ.m+1);S.carryNote='Stand Zeitnachweis '+pad(dim(lastZ.y,lastZ.m))+'.'+pad(lastZ.m+1)+'.'+lastZ.y;invalidate();save();msgs.push('Übertrag für '+S.startYear+' aktualisiert: '+lots.map(l=>l.m.slice(5)+'/'+l.m.slice(0,4)+' '+l.h).join(', ')+'.')}}
  UI.znMsg={cls:msgs.some(m=>/Abweichung|nicht/.test(m))?'w':'g',html:msgs.join('<br>')};render();
}
$('#znFile').addEventListener('change',ev=>{const fs=[...ev.target.files];ev.target.value='';if(fs.length){UI.znMsg={cls:'',html:'Lese Zeitnachweis …'};render();importZN(fs)}});
document.addEventListener('change',ev=>{const sc=ev.target.closest&&ev.target.closest('[data-act-stich]');if(sc){UI.stich={y:UI.year,m:+sc.value};render();return}});
document.addEventListener('change',ev=>{const mf=ev.target.closest&&ev.target.closest('[data-mf]');if(mf){if(mf.type==='text'){const k=dm(mf.value,UI.year);if(k){const yy=String(mf.value).trim();const keepY=/\d{1,2}[.\/-]\d{1,2}\.?\d{2,4}$/.test(yy)||/^\d{6}$|^\d{8}$/.test(yy);mf.value=k.slice(8)+'.'+k.slice(5,7)+'.'+(keepY?k.slice(0,4):'');mf.classList.remove('bad')}else if(k===null)mf.classList.add('bad');else mf.classList.remove('bad')}UI.mf[mf.dataset.mf]=mf.type==='checkbox'?mf.checked:mf.value;return}});
document.addEventListener('change',ev=>{const el=ev.target.closest&&ev.target.closest('[data-off]');if(!el)return;const m=+el.dataset.off,Y=yearData(UI.year);Y.official=Y.official||{};const v=el.value.trim();if(!v){if(Y.official[m])delete Y.official[m].saldo;if(Y.official[m]&&Object.keys(Y.official[m]).filter(k=>Y.official[m][k]!=null&&k!=='src'&&k!=='at').length===0)delete Y.official[m]}else{const h=parseH(v.replace('−','-'));Y.official[m]=Object.assign(Y.official[m]||{},{saldo:h});if(!Y.official[m].src)Y.official[m].src='manuell'}save();render()});
$('#drawer').addEventListener('change',ev=>{const el=ev.target.closest('[data-f]');if(el)drawerField(el,false)});
$('#drawer').addEventListener('input',ev=>{const el=ev.target.closest('[data-f="n"]');if(el)drawerField(el,true)});
$('#sheet').addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset.set)onSetting(el);
  else if(el.dataset.carry!=null){const L=ST.settings.carryLots[+el.dataset.carry];if(L){L[el.dataset.k]=el.value.trim();invalidate();save();renderSettings();render()}}
  else if(el.dataset.fair){const f=fairById(el.dataset.fair);if(f){f[el.dataset.k]=el.value.trim()||f[el.dataset.k];save();render()}}
});
$('#sheet').addEventListener('input',ev=>{const el=ev.target;if(el.dataset&&el.dataset.set==='fontS'){ST.settings.fontS=+el.value;applyGlass();const o=$('#fsv');if(o)o.textContent=el.value+' %';return}if(el.dataset&&el.dataset.col){const S=ST.settings;S.colors=S.colors||{};const d=COLDEF.find(x=>x[0]===el.dataset.col);if(d&&el.value.toLowerCase()===d[2])delete S.colors[el.dataset.col];else S.colors[el.dataset.col]=el.value;applyColors();clearTimeout(window.__colT);window.__colT=setTimeout(()=>{save();render()},400);return}if(el.dataset&&el.dataset.set==='glassT2'){ST.settings.glassT2=+el.value;applyGlass();const o=$('#gtv');if(o)o.textContent=el.value+' %'}});
$('#settings').addEventListener('click',ev=>{if(ev.target.id==='settings')$('#settings').hidden=true});
$('#fairwin').addEventListener('click',ev=>{if(ev.target.id==='fairwin')closeFairWin()});
$('#rptwin').addEventListener('click',ev=>{if(ev.target.id==='rptwin')closeReport()});
$('#fairwin').addEventListener('change',ev=>{const el=ev.target.closest('[data-fwk]');if(el){fwField(el);return}const n=ev.target.closest('[data-fwn]');if(n&&UI.fw){const f=fairById(UI.fw),v=n.value.trim();if(f&&v){f[n.dataset.fwn]=v;save();render(true)}renderFairWin()}});

/* Ziehen zum Markieren */
const grid=()=>document.getElementById('grid');
document.addEventListener('mousedown',ev=>{
  const c=ev.target.closest('#grid [data-k]');if(!c||ev.button!==0)return;
  ev.preventDefault();hideTip();const k=c.dataset.k;
  if(ev.shiftKey&&UI.anchor){UI.sel=new Set(rangeKeys(UI.anchor,k));UI.moved=true;UI.drag=false;markSel();renderRange();return}
  UI.anchor=k;UI.drag=true;UI.moved=false;UI.sel=new Set([k]);
});
document.addEventListener('mouseover',ev=>{
  const c=ev.target.closest('#grid [data-k]');
  if(UI.drag&&c){const k=c.dataset.k;if(k!==UI.anchor)UI.moved=true;UI.sel=new Set(rangeKeys(UI.anchor,k));markSel();hideTip();return}
  if(c&&!UI.drag)showTip(c,ev);else hideTip();
});
document.addEventListener('mousemove',ev=>{const t=$('#tip');if(!t.hidden)placeTip(ev)});
document.addEventListener('mouseup',()=>{
  if(!UI.drag)return;UI.drag=false;
  if(!UI.moved&&UI.sel.size===1){const k=[...UI.sel][0];UI.sel.clear();openDrawer(k);return}
  markSel();renderRange();
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&DP){dpClose();return}
  if(ev.key==='Enter'&&ev.target&&(ev.target.id==='nfName'||ev.target.id==='nfK')){ev.preventDefault();const b=document.querySelector('[data-act="nf-save"]');if(b)b.click();return}
  if(ev.key==='Escape'){if(!$('#rptwin').hidden)closeReport();else if(!$('#fairwin').hidden)closeFairWin();else if(!$('#settings').hidden)$('#settings').hidden=true;else if(UI.drawer){closeDrawer();render()}else if(UI.sel.size){UI.sel.clear();renderRange();render()}}
  if(UI.drawer&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    if(ev.key==='ArrowLeft'){UI.drawer=addDays(UI.drawer,-1);renderDrawer();render(true)}
    if(ev.key==='ArrowRight'){UI.drawer=addDays(UI.drawer,1);renderDrawer();render(true)}
  }
  if(ev.key==='Enter'){const c=document.activeElement.closest&&document.activeElement.closest('#grid [data-k]');if(c)openDrawer(c.dataset.k)}
});
function markSel(){document.querySelectorAll('#grid [data-k]').forEach(c=>c.classList.toggle('sel',UI.sel.has(c.dataset.k)||c.dataset.k===UI.drawer))}

/* Tooltip */
function showTip(c,ev){
  const k=c.dataset.k,dc=computeYear(+k.slice(0,4)).days[k];if(!dc)return;const e=dc.e,f=e.f&&fairById(e.f),t=$('#tip');
  const bal=dc.ist-dc.soll+dc.zSum;
  t.innerHTML=`<b>${fd(k)}</b>${dc.i.name?`<div class="tip-hol">${dc.i.legal?'Feiertag':'Sondertag'}: ${esc(dc.i.name)}${dc.i.frei?', dienstfrei':''}${dc.i.halb?', halber Tag':''}${dc.i.ft?', Zuschlag '+ST.settings.rates.ft+' %':''}</div>`:''}<div>${TYPES[e.t].label}${f?', '+esc(f.name):''}${e.t13?', 13.T':''}</div>${dc.work?`<div>${dc.times[0]}–${dc.times[1]}, netto ${fh(dc.net)}</div>`:''}${dc.zSum>0?`<div>Zuschläge ${fh(dc.zSum)}</div>`:''}${Math.abs(bal)>0.004?`<div>Tagesbilanz ${fhs(bal)}</div>`:''}${e.n?`<div>${esc(e.n)}</div>`:''}${e.ist?'<div>Echte Zeiten aus Zeitnachweis</div>':''}`;
  t.hidden=false;placeTip(ev);
}
function placeTip(ev){const t=$('#tip'),w=t.offsetWidth,h=t.offsetHeight;let x=ev.clientX+14,y=ev.clientY+14;if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y+h>innerHeight-8)y=ev.clientY-h-14;t.style.left=x+'px';t.style.top=y+'px'}
function hideTip(){$('#tip').hidden=true}
